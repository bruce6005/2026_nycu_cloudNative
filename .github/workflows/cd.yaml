name: cd

on:
  workflow_dispatch:
  workflow_call:

jobs:
  deploy-to-gcp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Compute release image tag
        id: meta
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$BRANCH_NAME" == release/* ]]; then
            VERSION="${BRANCH_NAME#release/}"
            IMAGE_TAG="$VERSION"
          elif [[ "$BRANCH_NAME" == release* ]]; then
            VERSION="${BRANCH_NAME#release}"
            IMAGE_TAG="$VERSION"
          else
            IMAGE_TAG="${github.sha}" # fallback
          fi
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Deploy Backend to Cloud Run
        run: |
          gcloud run deploy lab-system-backend \
            --image=asia-east1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/lab-system/backend:${{ steps.meta.outputs.image_tag }} \
            --region=asia-east1 \
            --platform=managed \
            --allow-unauthenticated

      - name: Deploy Frontend to Cloud Run
        run: |
          gcloud run deploy lab-system-frontend \
            --image=asia-east1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/lab-system/frontend:${{ steps.meta.outputs.image_tag }} \
            --region=asia-east1 \
            --platform=managed \
            --allow-unauthenticated
